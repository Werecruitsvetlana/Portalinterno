<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancers — We Recruit DR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1a1a1a; }

    .sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: #063958; padding: 24px 0; display: flex; flex-direction: column; }
    .sidebar-logo { color: #CEE4CC; font-size: 18px; font-weight: 700; padding: 0 20px; margin-bottom: 32px; }
    .sidebar a { display: flex; align-items: center; gap: 10px; padding: 11px 20px; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; transition: all 0.15s; }
    .sidebar a:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .sidebar a.active { background: rgba(255,255,255,0.12); color: #CEE4CC; font-weight: 600; }
    .sidebar-bottom { margin-top: auto; padding: 0 20px; }
    .sidebar-bottom button { width: 100%; padding: 10px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .sidebar-bottom button:hover { background: rgba(255,255,255,0.2); color: #fff; }

    .main { margin-left: 220px; padding: 32px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 24px; color: #063958; }

    .tabs { display: flex; gap: 0; border-bottom: 2px solid #e8edf2; margin-bottom: 24px; }
    .tab-btn { padding: 10px 20px; font-size: 14px; font-weight: 600; background: none; border: none; cursor: pointer; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
    .tab-btn.active { color: #063958; border-bottom-color: #063958; }
    .tab-btn .badge { display: inline-block; background: #ef4444; color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; margin-left: 6px; font-weight: 700; }

    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid #dde5ed; border-radius: 8px; font-size: 14px; outline: none; }
    .search-input:focus { border-color: #0F6B9F; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }

    .fl-card { background: #fff; border: 1.5px solid #e8edf2; border-radius: 12px; overflow: hidden; transition: all 0.2s; }
    .fl-card:hover { border-color: #0F6B9F; box-shadow: 0 4px 18px rgba(15,107,159,0.1); }
    .fl-card-header { background: linear-gradient(135deg, #063958 60%, #0F6B9F); padding: 1.2rem; display: flex; align-items: center; gap: 12px; }
    .fl-photo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid #CEE4CC; flex-shrink: 0; }
    .fl-initials { width: 56px; height: 56px; border-radius: 50%; background: #CEE4CC; color: #063958; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; flex-shrink: 0; }
    .fl-card-name { color: #fff; font-weight: 700; font-size: 15px; }
    .fl-card-titulo { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 2px; }
    .fl-card-body { padding: 1rem; }
    .fl-info-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .fl-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; background: #EBF4FA; color: #0F6B9F; }
    .fl-badge.sector { background: #f0fdf4; color: #15803d; }
    .fl-skills { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
    .fl-skill { font-size: 11px; background: #f5f7fa; border: 1px solid #e8edf2; border-radius: 4px; padding: 2px 8px; color: #555; }
    .fl-detail { font-size: 12.5px; color: #555; margin-bottom: 6px; line-height: 1.5; }
    .fl-detail strong { color: #063958; }
    .fl-portfolio { margin-bottom: 12px; }
    .fl-portfolio a { font-size: 12px; color: #0F6B9F; text-decoration: none; word-break: break-all; }
    .fl-portfolio a:hover { text-decoration: underline; }
    .fl-actions { display: flex; gap: 8px; padding: 0 1rem 1rem; }
    .btn-approve { flex: 1; padding: 9px; background: #063958; color: #CEE4CC; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-approve:hover { background: #0F6B9F; }
    .btn-reject { padding: 9px 14px; background: #fff; color: #ef4444; border: 1.5px solid #fca5a5; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-reject:hover { background: #fef2f2; }
    .btn-revoke { flex: 1; padding: 9px; background: #fff; color: #666; border: 1.5px solid #e8edf2; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-revoke:hover { background: #f5f7fa; }

    .empty { text-align: center; padding: 4rem 2rem; color: #666; grid-column: 1/-1; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }

    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; background: #063958; color: #fff; border-radius: 8px; font-size: 14px; z-index: 200; display: none; }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">We Recruit DR</div>
    <a href="index.html">📊 Dashboard</a>
    <a href="candidatos.html">👤 Candidatos</a>
    <a href="posiciones.html">💼 Posiciones</a>
    <a href="ternas.html">📋 Ternas</a>
    <a href="empresas.html">🏢 Empresas</a>
    <a href="freelancers.html" class="active">🎨 Freelancers</a>
    <a href="vacantes-portal.html">📝 Vacantes Portal</a>
    <div class="sidebar-bottom">
      <button onclick="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="main">
    <div class="page-header">
      <h1>Freelancers</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('pendientes')">Pendientes <span class="badge" id="badgePendientes">0</span></button>
      <button class="tab-btn" onclick="switchTab('aprobados')">Aprobados <span id="badgeAprobados" style="margin-left:6px;font-size:12px;color:#666;"></span></button>
    </div>

    <div class="controls">
      <input class="search-input" type="text" placeholder="Buscar por nombre, sector o habilidad..." id="searchInput" oninput="renderList()">
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = 'https://bohkpbkktcnwsglvcrax.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvaGtwYmtrdGNud3NnbHZjcmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NjY0MjYsImV4cCI6MjA5NjM0MjQyNn0.yW7atZCGHqipQ-KE-UH5J3DPlXvud5lzf5LMs3J9YzA';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allFreelancers = [];
    let activeTab = 'pendientes';

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      await load();
    }

    async function load() {
      const { data, error } = await sb
        .from('freelancers')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) { console.error(error); return; }
      allFreelancers = data || [];
      const pendientes = allFreelancers.filter(f => !f.aprobado).length;
      const aprobados = allFreelancers.filter(f => f.aprobado).length;
      document.getElementById('badgePendientes').textContent = pendientes;
      document.getElementById('badgeAprobados').textContent = aprobados;
      renderList();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i === 0 && tab === 'pendientes') || (i === 1 && tab === 'aprobados')));
      renderList();
    }

    function renderList() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const list = allFreelancers.filter(f => {
        const matchTab = activeTab === 'pendientes' ? !f.aprobado : f.aprobado;
        const skills = Array.isArray(f.habilidades) ? f.habilidades.join(' ') : (f.habilidades || '');
        const matchQ = !q || (f.nombre || '').toLowerCase().includes(q) || (f.sector || '').toLowerCase().includes(q) || skills.toLowerCase().includes(q);
        return matchTab && matchQ;
      });

      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = `<div class="empty"><div class="empty-icon">${activeTab === 'pendientes' ? '✅' : '🎨'}</div><p>${activeTab === 'pendientes' ? 'No hay perfiles pendientes de aprobación.' : 'No hay freelancers aprobados aún.'}</p></div>`;
        return;
      }

      grid.innerHTML = list.map(f => {
        const initials = (f.nombre || 'WR').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
        const skills = Array.isArray(f.habilidades) ? f.habilidades : (f.habilidades ? f.habilidades.split(',').map(s => s.trim()) : []);
        const portfolios = Array.isArray(f.portafolio_urls) ? f.portafolio_urls : [];
        const fecha = f.created_at ? new Date(f.created_at).toLocaleDateString('es-DO', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

        return `
        <div class="fl-card" id="card-${f.id}">
          <div class="fl-card-header">
            ${f.foto_url ? `<img class="fl-photo" src="${f.foto_url}" alt="${f.nombre}">` : `<div class="fl-initials">${initials}</div>`}
            <div>
              <div class="fl-card-name">${f.nombre || '—'}</div>
              <div class="fl-card-titulo">${f.titulo_profesional || '—'}</div>
            </div>
          </div>
          <div class="fl-card-body">
            <div class="fl-info-row">
              ${f.sector ? `<span class="fl-badge sector">${f.sector}</span>` : ''}
              ${f.anos_experiencia ? `<span class="fl-badge">${f.anos_experiencia} años exp.</span>` : ''}
              ${f.tarifa_hora ? `<span class="fl-badge">RD$ ${Number(f.tarifa_hora).toLocaleString()}/h</span>` : ''}
            </div>
            <div class="fl-skills">${skills.slice(0, 5).map(s => `<span class="fl-skill">${s}</span>`).join('')}</div>
            <div class="fl-detail"><strong>Email:</strong> ${f.email || '—'}</div>
            ${f.telefono ? `<div class="fl-detail"><strong>Tel:</strong> ${f.telefono}</div>` : ''}
            ${f.linkedin ? `<div class="fl-detail"><strong>LinkedIn:</strong> <a href="${f.linkedin}" target="_blank" style="color:#0F6B9F;">${f.linkedin.replace('https://www.linkedin.com/in/', '')}</a></div>` : ''}
            ${f.bio ? `<div class="fl-detail" style="margin-top:8px;font-style:italic;">"${f.bio.substring(0, 120)}${f.bio.length > 120 ? '...' : ''}"</div>` : ''}
            ${portfolios.length ? `<div class="fl-portfolio" style="margin-top:10px;"><strong style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#666;">Portafolio</strong><div style="margin-top:4px;">${portfolios.map(u => `<a href="${u}" target="_blank">📎 ${u.replace(/^https?:\/\//, '').substring(0, 40)}</a><br>`).join('')}</div></div>` : ''}
            <div class="fl-detail" style="margin-top:8px;color:#aaa;font-size:11px;">Registrado: ${fecha}</div>
          </div>
          <div class="fl-actions">
            ${!f.aprobado
              ? `<button class="btn-approve" onclick="aprobar('${f.id}')">✅ Aprobar y publicar</button>
                 <button class="btn-reject" onclick="rechazar('${f.id}')">✕</button>`
              : `<button class="btn-revoke" onclick="revocar('${f.id}')">Despublicar</button>`
            }
          </div>
        </div>`;
      }).join('');
    }

    async function aprobar(id) {
      const { error } = await sb.from('freelancers').update({ aprobado: true }).eq('id', id);
      if (error) { showToast('Error al aprobar'); return; }
      showToast('✅ Perfil aprobado y publicado');
      await load();
    }

    async function rechazar(id) {
      if (!confirm('¿Eliminar este perfil? Esta acción no se puede deshacer.')) return;
      const { error } = await sb.from('freelancers').delete().eq('id', id);
      if (error) { showToast('Error al eliminar'); return; }
      showToast('Perfil eliminado');
      await load();
    }

    async function revocar(id) {
      const { error } = await sb.from('freelancers').update({ aprobado: false }).eq('id', id);
      if (error) { showToast('Error'); return; }
      showToast('Perfil despublicado');
      await load();
    }

    function logout() {
      sb.auth.signOut().then(() => window.location.href = 'login.html');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    init();
  </script>
</body>
</html>
